          "output_tokens",
          "reasoning_tokens"
        ],
        "title": "TokenUsageCreate",
        "description": "A billable AI response: one metered token event with cost math inputs.\n\nusage_type is pinned to TOKENS so a caller cannot record token usage\nunder the api_call type by mistake. quantity is derived from the token\ncategories (total tokens) rather than taken from the caller."
      },
