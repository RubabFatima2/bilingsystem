# Local Postgres for development. Run the app with uv (see README).
#   docker compose up -d db
#   DATABASE_URL=postgresql+psycopg://billing:billing@localhost:5432/billing
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
